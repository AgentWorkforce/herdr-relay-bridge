id = "agent-relay.herdr-bridge"
name = "Agent Relay bridge"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Forward selected Herdr agent status changes to Agent Relay."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["npm", "ci", "--omit=dev"]

[[panes]]
id = "setup"
title = "Agent Relay setup"
description = "Create a Relay workspace and write the bridge configuration."
placement = "tab"
command = ["node", "dist/setup.mjs"]

[[panes]]
id = "bridge"
title = "Agent Relay bridge"
placement = "tab"
command = ["node", "dist/bridge.mjs"]
