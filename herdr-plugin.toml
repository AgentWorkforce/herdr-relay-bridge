id = "agent-relay.herdr-bridge"
name = "Agent Relay bridge"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Bridge Herdr status to Agent Relay and open live broker agents as panes."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["npm", "ci", "--omit=dev"]

[[panes]]
id = "setup"
title = "Agent Relay setup"
description = "Create a Relay workspace and write the bridge configuration."
placement = "tab"
command = ["node", "dist/setup.mjs"]

[[panes]]
id = "bridge"
title = "Agent Relay bridge"
placement = "tab"
command = ["node", "dist/bridge.mjs"]

[[panes]]
id = "fleet"
title = "Agent Relay fleet picker"
description = "Open one attached Herdr pane per live agent in the current workspace's broker project."
platforms = ["linux", "macos"]
placement = "overlay"
command = ["node", "dist/fleet-picker.mjs"]

[[panes]]
id = "fleet-node"
title = "Agent Relay fleet node"
description = "Serve this Herdr host as a fleet node so placements open agents as Herdr panes."
platforms = ["linux", "macos"]
placement = "tab"
command = ["sh", "-c", "exec node \"$HERDR_PLUGIN_ROOT/dist/fleet-node.mjs\""]

[[panes]]
id = "cloud"
title = "Agent Relay cloud pane"
description = "Warm a Daytona Cloud agent box and open its live broker terminal as a Herdr pane."
platforms = ["linux", "macos"]
placement = "overlay"
command = ["node", "dist/cloud-picker.mjs"]

[[panes]]
id = "fleet-agent"
title = "Agent Relay agent"
description = "Attach to a broker agent and project its authoritative state into Herdr."
platforms = ["linux", "macos"]
placement = "tab"
command = ["sh", "-c", "exec node \"$HERDR_PLUGIN_ROOT/dist/fleet-agent.mjs\""]
